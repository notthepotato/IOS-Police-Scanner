; RScan police-gear sensor for the ESP32-2432S028R "Cheap Yellow Display" (CYD).
;
; Everything is pinned to exact versions, so it builds the same on every computer.
; The libraries download as release archives from GitHub, so you don't need Git installed.

[platformio]
default_envs = cyd

[env:cyd]
; pioarduino = the community-maintained PlatformIO platform for the ESP32 Arduino core 3.x
; (this release ships arduino-esp32 3.3.12)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 460800 is reliable with the board's USB chip; drop to 115200 if uploads fail
upload_speed = 460800

build_flags =
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    https://github.com/h2zero/NimBLE-Arduino/archive/refs/tags/2.5.2.zip
    https://github.com/adafruit/Adafruit_BusIO/archive/refs/tags/1.17.4.zip
    https://github.com/adafruit/Adafruit-GFX-Library/archive/refs/tags/1.13.0.zip
    https://github.com/adafruit/Adafruit_ILI9341/archive/refs/tags/1.7.0.zip
    https://github.com/TheNitek/XPT2046_Bitbang_Arduino_Library/archive/refs/tags/v2.0.1.zip

; Adafruit ILI9341 lists touchscreen drivers for other boards as dependencies; this board
; doesn't use them, so keep them out of the build.
lib_ignore =
    Adafruit STMPE610
    Adafruit TouchScreen
    Adafruit TSC2007
