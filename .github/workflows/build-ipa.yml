# Builds an unsigned RoadScanner.ipa on a GitHub cloud Mac, and the ESP32 sensor firmware.
# Download both from the run's "Artifacts" section. Sign + install the .ipa with Sideloadly.
name: Build app and firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project RoadScanner.xcodeproj \
            -scheme RoadScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            RS_BUILD_COMMIT=${GITHUB_SHA::7} \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RoadScanner.app Payload/
          zip -qry RoadScanner.ipa Payload

      - uses: actions/upload-artifact@v6
        with:
          name: RoadScanner-ipa
          path: RoadScanner.ipa
          if-no-files-found: error

  firmware:
    # Builds the ESP32 sensor firmware with PlatformIO, so every push has a matching .bin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -d esp32/RScanSensor

      - uses: actions/upload-artifact@v6
        with:
          name: RScan-firmware
          path: esp32/RScanSensor/.pio/build/cyd/firmware.factory.bin
          if-no-files-found: error
