# Builds an unsigned RoadScanner.ipa on a GitHub cloud Mac.
# Download it from the run's "Artifacts" section, then sign + install it with Sideloadly.
name: Build iPhone app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project RoadScanner.xcodeproj \
            -scheme RoadScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RoadScanner.app Payload/
          zip -qry RoadScanner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RoadScanner-ipa
          path: RoadScanner.ipa
          if-no-files-found: error
